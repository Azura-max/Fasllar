<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fasllar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f0f8ff;
      color: #1a202c;
    }
    .container {
      text-align: center;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      background: white;
      max-width: 520px;
      width: 100%;
    }
    h1 {
      margin-bottom: 1rem;
    }
    .links {
      display: grid;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .links a {
      display: block;
      padding: 0.9rem 1.1rem;
      border-radius: 0.75rem;
      text-decoration: none;
      color: #fff;
      background: #2563eb;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .links a:hover {
      transform: translateY(-1px);
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fasllar</h1>
    <p>Quyidagi sahifalardan birini tanlang:</p>

      <a href="Qish.html">Qish</a>
      <a href="Yoz.html">Yoz</a>
    </div>
  </div>
</body>
</html>
